name: Daily MPV Package Build

on:
  # 允许手动触发
  workflow_dispatch:
  # 推送到release分支时也触发
  push:
    branches: [ release ]

jobs:
  build:
    runs-on: windows-latest

    # 为GITHUB_TOKEN添加必要权限
    permissions:
      contents: write        # 需要写入权限来创建release
      actions: read         # 读取actions权限
      checks: read          # 读取checks权限

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version

    - name: Install 7-Zip
      run: |
        # 安装7-Zip
        choco install 7zip -y
        # 验证安装
        7z --help

    - name: Install dependencies
      run: pip install --require-hashes -r requirements.txt

    - name: Run tests
      run: python run_tests.py
      env:
        PYTHONIOENCODING: utf-8

    - name: Run MPV config build
      id: build
      run: |
        $resultFile = Join-Path $env:RUNNER_TEMP "build/build-result.json"
        python run.py --log-level INFO --result-file $resultFile --previous-release "$env:GITHUB_REPOSITORY"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-Content $resultFile
        $json = (Get-Content $resultFile) -join ""
        echo "RESULT=$json" >> $env:GITHUB_OUTPUT
      shell: pwsh
      env:
        # 设置UTF-8编码以支持中文日志
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: utf-8
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ fromJSON(steps.build.outputs.RESULT).artifactName }}
        path: ${{ fromJSON(steps.build.outputs.RESULT).outputDir }}
        retention-days: 30

    - name: Create Release (if on release branch)
      if: github.ref == 'refs/heads/release'
      id: create_release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ fromJSON(steps.build.outputs.RESULT).archiveVersion }}
        name: ${{ fromJSON(steps.build.outputs.RESULT).releaseTitle }}
        body_path: ${{ fromJSON(steps.build.outputs.RESULT).releaseNotesPath }}
        files: |
          ${{ fromJSON(steps.build.outputs.RESULT).packagePath }}
          ${{ fromJSON(steps.build.outputs.RESULT).manifestAssetPath }}
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
