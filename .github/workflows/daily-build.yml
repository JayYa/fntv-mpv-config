name: Daily MPV Package Build

on:
  # 允许手动触发
  workflow_dispatch:
  # 推送到release分支时也触发
  push:
    branches: [ release ]

jobs:
  build:
    runs-on: windows-latest

    # 为GITHUB_TOKEN添加必要权限
    permissions:
      contents: write        # 需要写入权限来创建release
      actions: read         # 读取actions权限
      checks: read          # 读取checks权限

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install 7-Zip
      run: |
        # 安装7-Zip
        choco install 7zip -y
        # 验证安装
        7z --help

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: python run_tests.py
      env:
        PYTHONIOENCODING: utf-8

    - name: Fetch previous release manifest
      id: previous
      run: |
        # 上一版 Release 的 fntv-manifest.json：它的 knownHashes 和 obsolete 并入本次清单，契约测试检查只增不减。
        # 早于清单的 Release 没有这个资产，此时只用仓库里的 manifest-history.json。
        $release = gh release view --repo "$env:GITHUB_REPOSITORY" --json tagName,assets | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { Write-Error "读取上一版 Release 失败"; exit 1 }
        Write-Host "上一版 Release: $($release.tagName)"
        $dir = Join-Path $env:RUNNER_TEMP "previous-manifest"
        $path = Join-Path $dir "fntv-manifest.json"
        if ($release.assets.name -contains "fntv-manifest.json") {
          gh release download $release.tagName --repo "$env:GITHUB_REPOSITORY" --pattern fntv-manifest.json --dir $dir
          if ($LASTEXITCODE -ne 0) { Write-Error "下载上一版清单失败"; exit 1 }
          echo "MANIFEST=$path" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "上一版 Release 没有 fntv-manifest.json，只用 manifest-history.json"
          echo "MANIFEST=" >> $env:GITHUB_OUTPUT
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh

    - name: Run MPV config build
      id: build
      run: |
        $previous = @()
        if ("${{ steps.previous.outputs.MANIFEST }}") { $previous = @("--previous-manifest", "${{ steps.previous.outputs.MANIFEST }}") }
        $resultFile = Join-Path $env:RUNNER_TEMP "build/build-result.json"
        python run.py --log-level INFO --result-file $resultFile @previous
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-Content $resultFile
        $json = (Get-Content $resultFile) -join ""
        echo "RESULT=$json" >> $env:GITHUB_OUTPUT
      shell: pwsh
      env:
        # 设置UTF-8编码以支持中文日志
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: utf-8
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fntv-mpv-config-${{ fromJSON(steps.build.outputs.RESULT).timestamp }}
        path: ${{ fromJSON(steps.build.outputs.RESULT).outputDir }}
        retention-days: 30

    - name: Create Release (if on release branch)
      if: github.ref == 'refs/heads/release'
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ fromJSON(steps.build.outputs.RESULT).archiveVersion }}
        name: FNTV MPV v${{ fromJSON(steps.build.outputs.RESULT).timestamp }}
        body_path: ${{ fromJSON(steps.build.outputs.RESULT).releaseNotesPath }}
        # fntv-manifest.json 也单独上传（与 zip 根目录里的相同），供下一次构建并入历史哈希
        files: |
          ${{ fromJSON(steps.build.outputs.RESULT).packagePath }}
          ${{ fromJSON(steps.build.outputs.RESULT).manifestAssetPath }}
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
